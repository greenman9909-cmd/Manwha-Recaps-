name: Tests
on: [push, pull_request]
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install FFmpeg tools for actual media smoke test
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: python -m pip install -e ".[images]"
      - name: Compile source and tests
        run: python -m compileall -q ashentoons tests
      - run: python -m unittest discover -s tests -v
